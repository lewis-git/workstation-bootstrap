---
- name: Verify CLI commands run successfully
  ansible.builtin.command: "{{ item }}"
  loop:
    - git --version
    - jq --version
    - wget --version
    - terraform version
    - kubectl version --client
    - helm version --short
  environment:
    PATH: "/opt/local/bin:/opt/local/sbin:{{ ansible_env.PATH }}"
  changed_when: false
