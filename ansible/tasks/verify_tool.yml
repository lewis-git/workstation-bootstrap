---
- name: Verify {{ verify_command[0] }}
  block:
    - name: Run {{ verify_command[0] }}
      ansible.builtin.command:
        argv: "{{ verify_command }}"
      register: tool_check
      changed_when: false

  rescue:
    - name: Report verification failure
      ansible.builtin.fail:
        msg: >-
          {{ verify_command[0] }} failed verification.
          Check that it is installed and available on PATH.
          For versioned MacPorts tools, check:
          port select --list {{ verify_command[0] }}
          Original error:
          {{ ansible_failed_result.msg | default('Unknown error') }}
