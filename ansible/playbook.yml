---
- name: Configure DevOps workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  vars_files:
    - vars.yml

  tasks:
    - name: Install and verify tools
      ansible.builtin.include_tasks: tasks/install.yml
      loop: "{{ tools }}"
      loop_control:
        loop_var: tool
        label: "{{ tool.name }}"
